<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSH Arcade - 34K Games</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#fff;min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.logo-mark{width:32px;height:32px;background:#4f46e5;border-radius:8px;display:grid;place-items:center}
.badge{padding:4px 10px;border-radius:999px;background:#1e293b;border:1px solid #334155;font-size:10px;font-weight:700}
.hero{max-width:700px;margin:0 auto;padding:24px 16px 16px;text-align:center}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:.95;margin-bottom:8px}
.hero h1 span{background:linear-gradient(90deg,#4f46e5,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#94a3b8;font-size:13px}
.search-wrap{max-width:560px;margin:12px auto;position:sticky;top:58px;z-index:40;background:rgba(15,23,42,.9);backdrop-filter:blur(10px);padding:10px 16px}
.search-inner{position:relative}
.search-inner input{width:100%;height:48px;padding:0 44px 0 42px;border-radius:12px;border:1px solid #1e293b;background:#1e293b;color:#fff;font-size:14px;outline:none}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#0f172a;display:none;place-items:center;color:#94a3b8;border:0;cursor:pointer}
.clear-btn.show{display:grid}
.main{max-width:1280px;margin:0 auto;padding:12px 16px 24px}
.grid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.count{font-size:11px;padding:4px 10px;border-radius:999px;background:#4f46e5;color:#fff;font-weight:800}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media(max-width:600px){.games-grid{grid-template-columns:repeat(2,1fr)}}
.g-card{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.g-card:hover{transform:translateY(-3px);border-color:#4f46e5;box-shadow:0 10px 24px -12px rgba(79,70,229,.5)}
.g-thumb{height:130px;background:#0f172a;position:relative;overflow:hidden}
.g-thumb img{width:100%;height:100%;object-fit:cover}
.g-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);font-size:10px;font-weight:800;color:#fff}
.g-body{padding:10px 11px}
.g-body h3{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-body p{font-size:11px;color:#94a3b8;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#64748b;border-top:1px solid #0f172a;padding-top:6px;margin-top:6px}
.player-wrap{display:none;background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden;margin:14px 0}
.player-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #0f172a;font-size:14px;font-weight:700}
.iframe-box{background:#000;aspect-ratio:16/9}
.iframe-box iframe{width:100%;height:100%;border:0}
.close-btn{background:#0f172a;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:0;cursor:pointer;color:#fff}
.footer{text-align:center;padding:20px;color:#475569;font-size:11px;border-top:1px solid #1e293b;margin-top:20px}
.ad-box{background:#1e293b;border:1px solid #334155;border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;margin:14px auto;max-width:728px;overflow:hidden}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><div class="logo-mark">🎮</div> VSH Arcade</div>
  <div class="badge" id="topBadge">GitHub Pages • Fast</div>
</header>
<section class="hero">
  <h1>34K <span>Games Arcade</span></h1>
  <p id="heroSub">Loading 1645 games from GitHub...</p>
</section>
<div class="ad-box" id="adTop">
  <script async="async" data-cfasync="false" src="https://mittengulped.com/0a7245dd04fcd3b125e3c35eaef379dd/invoke.js"></script>
  <div id="container-0a7245dd04fcd3b125e3c35eaef379dd"></div>
</div>
<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search 1645 games - Drift, Car, Bike...">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
</div>
<main class="main">
  <div class="grid-head">
    <h2>🎯 Games</h2>
    <span class="count" id="countBadge">Loading...</span>
  </div>
  <div id="playerWrap" class="player-wrap">
    <div class="player-head"><div><b id="playingTitle">Game</b></div><button class="close-btn" onclick="closePlayer()">✕</button></div>
    <div class="iframe-box"><iframe id="gameIframe" src="" allowfullscreen allow="fullscreen; autoplay; encrypted-media"></iframe></div>
  </div>
  <div class="games-grid" id="gamesGrid"></div>
  <div id="notFound" style="display:none;text-align:center;padding:30px;background:#1e293b;border-radius:14px;margin-top:12px">
    <div style="font-size:24px">🔍</div>
    <h3 style="margin:8px 0">No games found</h3>
    <p style="color:#94a3b8;font-size:13px">Try different keywords</p>
  </div>
</main>
<div class="ad-box" id="adBottom">
  <script>
    atOptions = {
      'key' : '929af4020bd833c5ae192f19ecc512cb',
      'format' : 'iframe',
      'height' : 90,
      'width' : 728,
      'params' : {}
    };
  </script>
  <script src="https://mittengulped.com/929af4020bd833c5ae192f19ecc512cb/invoke.js"></script>
</div>
<footer class="footer">Hosted on GitHub Pages • 1645 Games • Fast • No domain needed • games.json from same repo</footer>
<script>
let ALL_GAMES = [];
let q = '';
const grid = document.getElementById('gamesGrid');
const badge = document.getElementById('countBadge');
const heroSub = document.getElementById('heroSub');
const topBadge = document.getElementById('topBadge');
const inp = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const notFound = document.getElementById('notFound');
function extractIframeSrc(embedHtml) {
  if (!embedHtml) return '';
  const match = embedHtml.match(/src=['"]([^'"]+)['"]/);
  return match ? match[1] : '';
}
async function loadGames() {
  try {
    // Fetch games.json from same repo (GitHub Pages)
    const res = await fetch('./games.json?v=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('Failed to fetch games.json: ' + res.status);
    const json = await res.json();
    
    console.log('JSON keys:', Object.keys(json));
    
    let hits = [];
    // PlayGama format: segments[].hits
    if (json.segments && Array.isArray(json.segments)) {
      console.log('Found segments:', json.segments.length);
      hits = json.segments.flatMap(seg => seg.hits || []);
      console.log('Total hits from segments:', hits.length);
    } else if (Array.isArray(json)) {
      hits = json;
    } else if (json.games) {
      hits = json.games;
    } else {
      throw new Error('Unknown JSON format - keys: ' + Object.keys(json).join(', '));
    }
    
    // Map to our format
    ALL_GAMES = hits.map((g,i) => {
      const thumb = (g.images && g.images[0]) || g.thumbnail || g.image || '';
      // gameURL is the export URL with ?clid= - this is the playable URL
      const gameUrl = g.gameURL || g.playgamaGameUrl || '';
      // Also try to extract from embed
      const embedSrc = extractIframeSrc(g.embed) || gameUrl;
      const title = g.title || g.name || `Game ${i+1}`;
      const category = (g.genres && g.genres[0]) || g.category || 'Arcade';
      
      return {
        id: g.id || i,
        title: String(title),
        category: String(category),
        thumbnail: String(thumb),
        iframe_url: String(embedSrc),
        slug: g.slug || ''
      };
    }).filter(g => g.title && (g.thumbnail || g.iframe_url));
    
    console.log(`Mapped ${ALL_GAMES.length} valid games`);
    heroSub.textContent = `Loaded ${ALL_GAMES.length} games from games.json • GitHub Pages • Fast`;
    topBadge.textContent = `${ALL_GAMES.length} Games • Live`;
    badge.textContent = `${ALL_GAMES.length} Games`;
    
    render();
    
  } catch(e) {
    console.error(e);
    heroSub.textContent = 'Error: ' + e.message;
    badge.textContent = '0 Games';
    grid.innerHTML = `<div style="grid-column:1/-1;background:#1e293b;padding:20px;border-radius:12px;color:#f87171">Error loading games.json: ${e.message}<br><br>Check console (F12) for details. Make sure games.json is valid PlayGama export.</div>`;
  }
}
function render() {
  const qq = q.toLowerCase();
  let list = ALL_GAMES.filter(g => !qq || g.title.toLowerCase().includes(qq) || g.category.toLowerCase().includes(qq) || g.slug.toLowerCase().includes(qq));
  badge.textContent = `${list.length} Games${qq ? ` for "${q}"` : ''}`;
  grid.innerHTML = '';
  if (list.length === 0) {
    notFound.style.display = 'block';
    return;
  }
  notFound.style.display = 'none';
  // Show 300 max for speed, search to filter
  list.slice(0, 300).forEach(g => {
    const el = document.createElement('div');
    el.className = 'g-card';
    const imgSrc = g.thumbnail || `https://placehold.co/400x300/1e293b/4f46e5?text=${encodeURIComponent(g.title)}`;
    el.innerHTML = `
      <div class="g-thumb">
        <img src="${imgSrc}" alt="${g.title}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1e293b/4f46e5?text=${encodeURIComponent(g.title)}'">
        <span class="g-badge">${g.category}</span>
      </div>
      <div class="g-body">
        <h3 title="${g.title}">${g.title}</h3>
        <p>${g.category}</p>
        <div class="g-meta"><span>★ 4.8</span><span>Play →</span></div>
      </div>
    `;
    el.onclick = () => {
      if (!g.iframe_url) {
        alert('No playable URL for this game');
        return;
      }
      document.getElementById('playerWrap').style.display = 'block';
      document.getElementById('playingTitle').textContent = g.title;
      document.getElementById('gameIframe').src = g.iframe_url;
      window.scrollTo({top: document.getElementById('playerWrap').offsetTop - 70, behavior: 'smooth'});
    };
    grid.appendChild(el);
  });
  if (list.length > 300) {
    const more = document.createElement('div');
    more.style.gridColumn = '1/-1';
    more.style.textAlign = 'center';
    more.style.padding = '16px';
    more.style.color = '#94a3b8';
    more.style.fontSize = '12px';
    more.textContent = `Showing 300 of ${list.length} games - search to filter more`;
    grid.appendChild(more);
  }
}
function closePlayer() {
  document.getElementById('playerWrap').style.display = 'none';
  document.getElementById('gameIframe').src = '';
}
inp.addEventListener('input', e => {
  q = e.target.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);
  render();
});
clearBtn.onclick = () => { inp.value = ''; q = ''; clearBtn.classList.remove('show'); render(); };
loadGames();
</script>
</body>
</html>
