.footer{text-align:center;padding:20px;color:#475569;font-size:11px;border-top:1px solid #1e293b;margin-top:20px}
.ad-box{background:#1e293b;border:1px solid #334155;border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;margin:14px auto;max-width:728px;overflow:hidden}

<script>
// CONFIG: How many parts you split into
const TOTAL_PARTS = 34; // if 34K / 1000 = 34 parts
// If you have 2420 games now, set to 3 parts (1000 each)
let ALL_GAMES = [];
let loadedParts = 0;
let q = '';
const grid = document.getElementById('gamesGrid');
const badge = document.getElementById('countBadge');
const heroSub = document.getElementById('heroSub');
const topBadge = document.getElementById('topBadge');
const progressBar = document.getElementById('progressBar');
const inp = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const notFound = document.getElementById('notFound');
function extractIframeSrc(embedHtml) {
  if (!embedHtml) return '';
  const match = embedHtml.match(/src=['"]([^'"]+)['"]/);
  return match ? match[1] : '';
}
async function loadPart(partNum) {
  const urls = [
    `./games-part-${partNum}.json`,
    `./split/games-part-${partNum}.json`
  ];
  for (let url of urls) {
    try {
      const res = await fetch(url + '?t=' + Date.now(), {cache: 'no-store'});
      if (!res.ok) continue;
      const json = await res.json();
      let hits = [];
      if (json.segments) {
        hits = json.segments.flatMap(seg => seg.hits || []);
      } else if (Array.isArray(json)) {
        hits = json;
      }
      return hits.map((g,i) => ({
        id: g.id || `${partNum}-${i}`,
        title: String(g.title || g.name || `Game ${i}`),
        category: String((g.genres && g.genres[0]) || g.category || 'Arcade'),
        thumbnail: String((g.images && g.images[0]) || g.thumbnail || ''),
        iframe_url: String(extractIframeSrc(g.embed) || g.gameURL || ''),
        slug: g.slug || ''
      })).filter(g => g.title && (g.thumbnail || g.iframe_url));
    } catch(e) {
      console.warn(`Failed part ${partNum} url ${url}`, e.message);
    }
  }
  return [];
}
async function loadAll() {
  // First try to detect how many parts exist via manifest.json
  let partsList = [];
  try {
    const manifestRes = await fetch('./split/manifest.json');
    if (manifestRes.ok) {
      partsList = await manifestRes.json();
      console.log('Found manifest:', partsList);
    }
  } catch(e) {}
  
  // If no manifest, try to guess - try games.json first (single file), then parts
  if (partsList.length === 0) {
    try {
      const singleRes = await fetch('./games.json');
      if (singleRes.ok) {
        const json = await singleRes.json();
        let hits = [];
        if (json.segments) hits = json.segments.flatMap(s => s.hits || []);
        else hits = Array.isArray(json) ? json : [];
        if (hits.length > 0) {
          ALL_GAMES = hits.map((g,i) => ({
            id: g.id || i,
            title: String(g.title || `Game ${i}`),
            category: String((g.genres && g.genres[0]) || 'Arcade'),
            thumbnail: String((g.images && g.images[0]) || ''),
            iframe_url: String(extractIframeSrc(g.embed) || g.gameURL || ''),
            slug: g.slug || ''
          })).filter(g => g.title);
          heroSub.textContent = `Loaded ${ALL_GAMES.length} games from games.json • Fast`;
          topBadge.textContent = `${ALL_GAMES.length} Games`;
          badge.textContent = `${ALL_GAMES.length} Games`;
          render();
          return;
        }
      }
    } catch(e) {}
    
    // Fallback: try parts 1-34 sequentially until 404
    for (let i=1; i<=50; i++) {
      const games = await loadPart(i);
      if (games.length === 0) {
        if (i===1) continue; // try next
        else break; // no more parts
      }
      ALL_GAMES.push(...games);
      loadedParts++;
      const pct = Math.round((loadedParts / TOTAL_PARTS) * 100);
      progressBar.style.width = pct + '%';
      topBadge.textContent = `Loading ${loadedParts}/${TOTAL_PARTS} • ${ALL_GAMES.length} games`;
      heroSub.textContent = `Loaded ${ALL_GAMES.length} games... ${pct}%`;
      badge.textContent = `${ALL_GAMES.length} Games`;
      render();
    }
    heroSub.textContent = `Loaded ${ALL_GAMES.length} games • All parts loaded • Fast & Unblocked`;
    topBadge.textContent = `${ALL_GAMES.length} Games • Live`;
  } else {
    // Load from manifest
    for (let idx=0; idx<partsList.length; idx++) {
      const file = partsList[idx];
      try {
        const res = await fetch(`./split/${file}`);
        if (!res.ok) { const r2 = await fetch(`./${file}`); if (!r2.ok) continue; var json = await r2.json(); }
        else var json = await res.json();
        let hits = json.segments ? json.segments.flatMap(s => s.hits || []) : (Array.isArray(json) ? json : []);
        const mapped = hits.map((g,i) => ({
          id: g.id || i,
          title: String(g.title || `Game ${i}`),
          category: String((g.genres && g.genres[0]) || 'Arcade'),
          thumbnail: String((g.images && g.images[0]) || ''),
          iframe_url: String(extractIframeSrc(g.embed) || g.gameURL || ''),
          slug: g.slug || ''
        })).filter(g => g.title);
        ALL_GAMES.push(...mapped);
        loadedParts++;
        progressBar.style.width = Math.round((loadedParts/partsList.length)*100) + '%';
        topBadge.textContent = `Loading ${loadedParts}/${partsList.length}`;
        heroSub.textContent = `Loaded ${ALL_GAMES.length} games...`;
        badge.textContent = `${ALL_GAMES.length} Games`;
        render();
      } catch(e) { console.error('Failed', file, e); }
    }
  }
  render();
}
function render() {
  const qq = q.toLowerCase();
  let list = ALL_GAMES.filter(g => !qq || g.title.toLowerCase().includes(qq) || g.category.toLowerCase().includes(qq) || g.slug.toLowerCase().includes(qq));
  badge.textContent = `${list.length} Games${qq ? ` for "${q}"` : ''}`;
  grid.innerHTML = '';
  if (list.length === 0 && ALL_GAMES.length>0) { notFound.style.display='block'; return; }
  notFound.style.display='none';
  list.slice(0, 300).forEach(g => {
    const el = document.createElement('div');
    el.className = 'g-card';
    const imgSrc = g.thumbnail || `https://placehold.co/400x300/1e293b/4f46e5?text=${encodeURIComponent(g.title)}`;
    el.innerHTML = `
      <div class="g-thumb"><img src="${imgSrc}" alt="${g.title}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1e293b/4f46e5?text=${encodeURIComponent(g.title)}'"><span class="g-badge">${g.category}</span></div>
      <div class="g-body"><h3>${g.title}</h3><p>${g.category}</p><div class="g-meta"><span>★ 4.8</span><span>Play →</span></div></div>`;
    el.onclick = () => {
      if (!g.iframe_url) return;
      document.getElementById('playerWrap').style.display='block';
      document.getElementById('playingTitle').textContent=g.title;
      document.getElementById('gameIframe').src=g.iframe_url;
      window.scrollTo({top: document.getElementById('playerWrap').offsetTop-70, behavior:'smooth'});
    };
    grid.appendChild(el);
  });
}
function closePlayer(){document.getElementById('playerWrap').style.display='none';document.getElementById('gameIframe').src='';}
inp.addEventListener('input', e=>{q=e.target.value.trim();clearBtn.classList.toggle('show', q.length>0);render();});
clearBtn.onclick=()=>{inp.value='';q='';clearBtn.classList.remove('show');render();};
loadAll();
</script>
